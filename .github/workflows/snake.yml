name: Generate Snake & Profile Cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Der öffentliche github-readme-stats-Server (vercel.app) antwortet nur noch mit 503 –
      # die Karten werden hier selbst erzeugt und landen mit der Snake im Branch "output".
      # Karten zuerst: die Snake-Action (Docker, root) legt dist/ sonst schreibgeschützt an.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&include_all_commits=true&ring_color=6e3bf3&title_color=6e3bf3&text_color=8b949e&icon_color=6e3bf3&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&theme=transparent&title_color=6e3bf3&text_color=8b949e&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin homelab-packet-tracer
        uses: stats-organization/github-readme-stats-action@v2
        with: { card: pin, path: dist/pin-homelab-packet-tracer.svg, token: "${{ secrets.GITHUB_TOKEN }}",
                options: "username=${{ github.repository_owner }}&repo=homelab-packet-tracer&theme=transparent&title_color=6e3bf3&icon_color=6e3bf3&text_color=8b949e&hide_border=true" }
      - name: Pin DockPilot
        uses: stats-organization/github-readme-stats-action@v2
        with: { card: pin, path: dist/pin-DockPilot.svg, token: "${{ secrets.GITHUB_TOKEN }}",
                options: "username=${{ github.repository_owner }}&repo=DockPilot&theme=transparent&title_color=6e3bf3&icon_color=6e3bf3&text_color=8b949e&hide_border=true" }
      - name: Pin Open-LLM-VTuber-Addons
        uses: stats-organization/github-readme-stats-action@v2
        with: { card: pin, path: dist/pin-Open-LLM-VTuber-Addons.svg, token: "${{ secrets.GITHUB_TOKEN }}",
                options: "username=${{ github.repository_owner }}&repo=Open-LLM-VTuber-Addons&theme=transparent&title_color=6e3bf3&icon_color=6e3bf3&text_color=8b949e&hide_border=true" }
      - name: Pin parasitebot
        uses: stats-organization/github-readme-stats-action@v2
        with: { card: pin, path: dist/pin-parasitebot.svg, token: "${{ secrets.GITHUB_TOKEN }}",
                options: "username=${{ github.repository_owner }}&repo=parasitebot&theme=transparent&title_color=6e3bf3&icon_color=6e3bf3&text_color=8b949e&hide_border=true" }
      - name: Pin EnvTwin
        uses: stats-organization/github-readme-stats-action@v2
        with: { card: pin, path: dist/pin-EnvTwin.svg, token: "${{ secrets.GITHUB_TOKEN }}",
                options: "username=${{ github.repository_owner }}&repo=EnvTwin&theme=transparent&title_color=6e3bf3&icon_color=6e3bf3&text_color=8b949e&hide_border=true" }

      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
